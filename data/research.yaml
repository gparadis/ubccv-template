# SECTION 9: scholarly and professional activities.

statement: >-
  My research develops statistical methods for environmental and ecological data, with
  emphasis on estimability under imperfect observation, reproducibility, and open
  software. I work with government agencies and non-profit partners to make monitoring
  programs and their analyses more informative for decision-making.

