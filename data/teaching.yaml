course_descriptions:
  - code: STAT 200
    title: Elementary Statistics for Applications
    credits: '3'
    contact_pattern: 2-0-2
    description: Descriptive statistics, probability, sampling distributions, confidence
      intervals and hypothesis testing, applied to problems from across the sciences.
  - code: STAT 406
    title: Methods for Statistical Learning
    credits: '3'
    contact_pattern: 2-0-2
    description: Model selection, regularization, resampling, and modern methods for
      regression and classification, with reproducible case studies.

