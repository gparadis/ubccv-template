# SECTION 8: teaching.

statement: >-
  I teach statistical methodology and reproducible data analysis, with an emphasis on
  bringing current research practice into undergraduate and graduate classrooms. My
  courses combine theory with hands-on work on real data sets, and all course materials
  are maintained in version control so students can see how the analysis was built.

